[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    l2: layer-2 (Ethernet/data-link) hardware integration test
    l3: layer-3 (IPv4/ICMP/reassembly) hardware integration test
    dut_reset: requires a DTR-based DUT reset before the test runs
    requires_hardware: needs HW_TEST=1 + Pi reachable
    slow: takes multiple seconds of real wall-clock time
