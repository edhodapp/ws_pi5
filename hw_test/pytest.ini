[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    l2: layer-2 (Ethernet/data-link) hardware integration test
    l3: layer-3 (IPv4/ICMP/reassembly) hardware integration test
    l4: layer-4 (TCP) hardware integration test
    l5: layer-5 (HTTP/appliance) hardware integration test
    perf: perf-instrumented test; requires a matching PERF=<flavor> kernel build
    dispatch: net_recv_one dispatch-path perf test; requires PERF=dispatch
    dut_reset: requires a DTR-based DUT reset before the test runs
    requires_hardware: needs HW_TEST=1 + Pi reachable
    slow: takes multiple seconds of real wall-clock time
    dhcp_only: requires the kernel to be running with dhcp=yes; skipped when NETWORK_MODE=static
    static_only: requires the kernel to be running with dhcp=no + a static IP; skipped when NETWORK_MODE=dhcp
