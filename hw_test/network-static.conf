# WSPI5CFG
#
# Static-IP test-rig configuration. Pushed via
# `hw_send.py --network-conf hw_test/network-static.conf kernel8.img`
# to the chainloader-mode Pi 4 so the kernel reads these values from
# the initramfs region (0x20000000) at boot. Same chainloader SD,
# same kernel — only the network.conf bytes pushed alongside the
# kernel differ between the two test passes.

# Required: this Pi's static IPv4 address (test rig: 10.0.0.2).
ip=10.0.0.2

# Required: subnet netmask. Documentation only today (D010 — the
# stack uses always-via-gateway routing).
netmask=255.255.255.0

# Required: laptop's Pi-facing interface IP (test rig: 10.0.0.1).
gateway=10.0.0.1

# Required: this Pi's hostname. Reachable as wspi5.local once mDNS
# comes up.
hostname=wspi5

# Optional: NTP server. Commented out — the rig doesn't run one.
#ntp_server=216.239.35.0

# Optional: explicit MAC. Commented out — use the factory MAC from
# the Pi 4 OTP fuses (mailbox tag 0x00010003).
#mac=de:ad:be:ef:ca:fe

# Static-IP path: dhcp=no. With this set, the ip / netmask / gateway
# fields above are required.
dhcp=no
