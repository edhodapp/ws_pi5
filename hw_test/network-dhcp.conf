# WSPI5CFG
#
# DHCP-mode test-rig configuration. Pushed via
# `hw_send.py --network-conf hw_test/network-dhcp.conf kernel8.img`
# to the chainloader-mode Pi 4. The kernel issues DHCP DISCOVER on
# boot and is reachable at the dnsmasq-assigned address; tests find
# it via `avahi-resolve wspi5.local`.

# DHCP path: dhcp=yes. The ip / netmask / gateway fields become
# OPTIONAL (DHCP supplies them) per D017; only hostname is required.
# On DHCP failure the kernel halts with panic pattern D (`-..`) so a
# misconfigured rig is loud, not silent.
dhcp=yes

# Required: this Pi's hostname. Sent in DHCP option 12 so dnsmasq
# can use it for the lease record. Reachable as wspi5.local once mDNS
# comes up — test infra resolves via avahi-resolve, not a static IP.
hostname=wspi5

# Optional: NTP server. Commented out — the rig doesn't run one.
#ntp_server=216.239.35.0

# Optional: explicit MAC. Commented out — use the factory MAC from
# the Pi 4 OTP fuses (mailbox tag 0x00010003).
#mac=de:ad:be:ef:ca:fe
