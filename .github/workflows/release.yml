name: Release

# Trigger on pushed tags (`v*`) AND allow manual runs for smoke-testing
# the workflow before cutting an actual tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write        # needed to attach assets to a Release

jobs:
  build-pi4-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install aarch64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-aarch64-linux-gnu

      - name: Build Pi 4 kernel
        run: |
          make clean
          make PLATFORM=pi4
          ls -lh kernel8.img

      # QEMU raspi3b test-kernel run — catches regressions the release
      # build shouldn't ship with even if the upstream tag was pushed
      # by mistake. Cheap compared to the alternative of shipping a
      # broken image.
      - name: Install QEMU for test kernel
        run: sudo apt-get install -y qemu-system-arm

      - name: Run QEMU test suite
        run: make test

      - name: Upload kernel as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel8.img
          path: kernel8.img
          retention-days: 30

      # Only attach to a GitHub Release when triggered by a tag push.
      # workflow_dispatch runs stop at the workflow artifact above —
      # useful for validating the build without producing a Release.
      - name: Attach kernel to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: kernel8.img
          fail_on_unmatched_files: true
          body: |
            Pi 4 appliance kernel built from ${{ github.ref_name }}.

            Download `kernel8.img`, then on your host:

            ```
            scripts/mk_appliance.py kernel8.img examples/public/ appliance.img
            scripts/mk_sd.sh --image appliance.img sd.img
            ```

            Flash `sd.img` to an SD card with Raspberry Pi Imager,
            balenaEtcher, or `dd`, insert into a Pi 4, and power on.
