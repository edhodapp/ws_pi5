# dnsmasq config for the ws_pi5 DHCP test rig.
#
# Used by scripts/dnsmasq-rig.sh as the default config. Bound to the
# laptop's Pi-facing USB Ethernet adapter only, so this dnsmasq does
# not affect other interfaces or the laptop's normal name resolution
# (systemd-resolved continues to handle DNS via 127.0.0.53).
#
# Range matches DHCP_POOL_START / DHCP_POOL_END in hw_test/test_dhcp.py
# and the strict-DHCP-pool filter in scripts/hw_tests.sh's
# resolve_pi4_ip. If you change the range here, change those too.
interface=enx00e04c0a2bed
bind-interfaces
no-dhcp-interface=wlp60s0
no-dhcp-interface=lo
dhcp-authoritative
dhcp-range=10.0.0.100,10.0.0.110,255.255.255.0,12h
log-dhcp
log-facility=/tmp/dnsmasq-wspi5.log
pid-file=/tmp/dnsmasq-wspi5.pid
# Lease file in /tmp so dnsmasq running as the rig user (not root)
# can write it. The system default /var/lib/misc/dnsmasq.leases is
# root-owned and unwritable by us. hw_tests.sh's resolver reads
# from this same path (see WSPI5_DNSMASQ_LEASES override).
dhcp-leasefile=/tmp/dnsmasq-wspi5.leases
# Don't run as a DNS server — avahi already owns mDNS on 5353 and
# we don't want this dnsmasq fielding the laptop's normal DNS queries.
port=0
